name: Pytest PyPI CLI Package Devcontainer Across Versions

on:
  release:
    types: [published]
  schedule:
    - cron: '30 5,15 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to test (for example, v0.2.6); blank tests latest'
        required: false
        type: string

jobs:
  test-linux:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [
          "latest",
          "12.1.2ghidra3.13python-bookworm",
          "12.1.2ghidra3.13python-trixie",
          "12.1.2ghidra3.13python-bookworm-slim",
          "12.1.2ghidra3.13python-trixie-slim",
          "11.3.2ghidra3.12python-bookworm",
          "11.4.1ghidra3.11python-bookworm",
          # "11.3ghidra3.9python-bookworm",
          "12.0ghidra3.13python-bookworm",
        ]

    steps:
    - uses: actions/checkout@v4

    - name: Overwrite original devcontainer with workflow devcontainer
      run: |
        cp .github/workflows/devcontainer.json .devcontainer/devcontainer.json

    - name: Test CLI with pytest on devcontainer
      env:
        DC_IMAGE_TAG: ${{ matrix.image }}
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/clearbluejar/ghidra-python
        cacheFrom: ghcr.io/clearbluejar/ghidra-python
        imageTag: ${{ matrix.image }}
        push: never
        runCmd: |
          env
          ls /usr/local/include/
          pip install --upgrade pip
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:/root/.cargo/bin:$PATH"
          
          # Create and activate an isolated virtual environment
          uv venv
          . .venv/bin/activate
          
          # If Ghidra major version is 11, pin pyghidra==2.2.1 first
          if [[ "$GHIDRA_VERSION" == 11.* ]]; then
            echo "Detected Ghidra $GHIDRA_VERSION, pinning pyghidra==2.2.1..."
            uv pip install "pyghidra==2.2.1"
          fi

          # Test the version that triggered this release, not a cached older
          # PyPI version. Scheduled and manual runs continue to test latest.
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.version }}"
          PACKAGE_SPEC="pyghidra-mcp-cli[dev]"
          if [ -n "$RELEASE_TAG" ]; then
            RELEASE_VERSION="${RELEASE_TAG#v}"
            PACKAGE_SPEC="${PACKAGE_SPEC}==${RELEASE_VERSION}"
          fi
          for attempt in $(seq 1 12); do
            if uv pip install --refresh "$PACKAGE_SPEC"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          if [ -n "$RELEASE_TAG" ]; then
            python -c 'import importlib.metadata as m, sys; assert all(m.version(p) == sys.argv[1] for p in ("pyghidra-mcp", "pyghidra-mcp-cli"))' "$RELEASE_VERSION"
          fi
          
          # Change to CLI directory where the tests are located
          cd cli
          
          # Use the active environment; uv run would sync the local CLI project.
          python -m pytest tests/ -v --doctest-modules --junitxml=junit/pypi-test-results-${{ matrix.image }}.xml

    - name: Upload CLI test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: cli-pypi-test-results-${{ matrix.image }}
        path: junit/pypi-test-results-${{ matrix.image }}.xml
        retention-days: 7
